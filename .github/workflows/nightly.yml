name: Create Nightly Release

on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed
    branches:
      - rerelease-game
  workflow_dispatch:

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: ./artifacts

      - name: Package artifacts
        run: |
          mkdir ./assets
          for dir in ./artifacts/*/; do
            dirname=$(basename "$dir")
            echo "Packaging $dirname"
            cp readme.md building.md "$dir"
            (cd "$dir" && zip -r "../../assets/$dirname.zip" .)
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y%m%d')
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          SHORT_SHA=${SHA:0:7}
          TAG="nightly-$DATE-$SHORT_SHA"
          NAME="Nightly Build ($DATE)"
          
          gh release create "$TAG" ./assets/*.zip \
            --title "$NAME" \
            --notes "Automated nightly build for branch rerelease-game. Commit: $SHA" \
            --prerelease
